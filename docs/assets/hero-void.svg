<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Vikram - AI/ML Engineer">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#05070d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="razor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.34" stop-color="#8B5CF6"/>
      <stop offset="0.68" stop-color="#FF1F4B"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#5A6B85"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ore" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0e1626" stroke-width="1"/>
    </pattern>
    <pattern id="carbon" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="#070a12"/>
      <rect x="3" width="3" height="6" fill="#05070c"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{0%{transform:translateY(-30px);opacity:0}12%{opacity:.55}50%{opacity:.95}88%{opacity:.45}100%{transform:translateY(360px);opacity:0}}
    .beam{animation:beam 9s ease-in-out infinite}
    @keyframes beam{0%,100%{opacity:.18;transform:translateX(-40px)}50%{opacity:.6;transform:translateX(40px)}}
    .f1{animation:fl1 7s ease-in-out infinite}
    .f2{animation:fl2 9s ease-in-out infinite}
    .f3{animation:fl3 6s ease-in-out infinite}
    .f4{animation:fl4 11s ease-in-out infinite}
    @keyframes fl1{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(26px,-30px);opacity:.85}}
    @keyframes fl2{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(-34px,-22px);opacity:.7}}
    @keyframes fl3{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(14px,24px);opacity:.8}}
    @keyframes fl4{0%,100%{transform:translate(0,0);opacity:.1}50%{transform:translate(-20px,30px);opacity:.55}}
    .node{animation:node 3.2s ease-in-out infinite}
    @keyframes node{0%,100%{opacity:.35}50%{opacity:1}}
    .trace{stroke-dasharray:6 10;animation:trace 4s linear infinite}
    @keyframes trace{to{stroke-dashoffset:-160}}
    .bar{animation:bar 5s ease-in-out infinite}
    @keyframes bar{0%,100%{transform:scaleX(.25);opacity:.5}50%{transform:scaleX(1);opacity:1}}
    .caret{animation:caret 1s steps(1) infinite}
    @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    .rise{animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  ]]></style>

  <rect width="1200" height="340" fill="url(#void)"/>
  <rect width="1200" height="340" fill="url(#carbon)" opacity="0.5"/>
  <rect width="1200" height="340" fill="url(#ore)" opacity="0.85"/>
  <rect width="1200" height="340" fill="url(#bloom)"/>

  <!-- moving light beam -->
  <rect class="beam" x="140" y="0" width="260" height="340" fill="url(#razor)" opacity="0.12"/>

  <!-- corner brackets -->
  <g stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.85">
    <path d="M18 60V18h60"/>
    <path d="M1182 60V18h-60"/>
    <path d="M18 280v42h60"/>
    <path d="M1182 280v42h-60"/>
  </g>

  <!-- data particles -->
  <g fill="#00E5FF">
    <circle class="f1" cx="150" cy="120" r="3"/>
    <circle class="f3" cx="230" cy="240" r="2.2"/>
    <circle class="f2" cx="1010" cy="110" r="3.2"/>
    <circle class="f4" cx="1090" cy="235" r="2.4"/>
    <circle class="f1" cx="330" cy="70" r="2"/>
  </g>
  <g fill="#FF1F4B">
    <circle class="f2" cx="905" cy="255" r="2.6"/>
    <circle class="f4" cx="285" cy="300" r="2"/>
  </g>
  <g fill="#FFB300">
    <circle class="f3" cx="980" cy="70" r="2"/>
  </g>

  <!-- neural trace (left) -->
  <g stroke="#8B5CF6" stroke-width="1.4" opacity="0.9">
    <path class="trace" d="M60 170 L140 130 L140 210 Z" fill="none"/>
    <path class="trace" d="M140 130 L215 170 M140 210 L215 170" fill="none"/>
  </g>
  <g fill="#00E5FF">
    <circle class="node" cx="60" cy="170" r="4"/>
    <circle class="node" cx="140" cy="130" r="4" style="animation-delay:.4s"/>
    <circle class="node" cx="140" cy="210" r="4" style="animation-delay:.8s"/>
    <circle class="node" cx="215" cy="170" r="4" style="animation-delay:1.2s"/>
  </g>
  <!-- neural trace (right) -->
  <g stroke="#FF1F4B" stroke-width="1.4" opacity="0.9">
    <path class="trace" d="M1140 170 L1060 130 L1060 210 Z" fill="none"/>
    <path class="trace" d="M1060 130 L985 170 M1060 210 L985 170" fill="none"/>
  </g>
  <g fill="#FFB300">
    <circle class="node" cx="1140" cy="170" r="4"/>
    <circle class="node" cx="1060" cy="130" r="4" style="animation-delay:.4s"/>
    <circle class="node" cx="1060" cy="210" r="4" style="animation-delay:.8s"/>
    <circle class="node" cx="985" cy="170" r="4" style="animation-delay:1.2s"/>
  </g>

  <!-- name -->
  <g class="rise">
    <text x="600" y="150" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
          font-size="104" font-weight="700" letter-spacing="10" fill="url(#steel)" filter="url(#softglow)">VIKRAM</text>
    <text x="600" y="150" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
          font-size="104" font-weight="700" letter-spacing="10" fill="none" stroke="#00E5FF" stroke-width="0.6" opacity="0.6">VIKRAM</text>
  </g>

  <!-- role strip -->
  <g class="rise" style="animation-delay:.25s">
    <text x="600" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
          font-size="22" letter-spacing="7" fill="#00E5FF" filter="url(#glow)">AI / ML ENGINEER</text>
  </g>

  <text x="600" y="232" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="14.5" letter-spacing="2.4" fill="#7f93af">RAG SYSTEMS &#183; LLM APPLICATIONS &#183; AUTONOMOUS AGENTS</text>

  <!-- status ticker -->
  <g class="rise" style="animation-delay:.5s">
    <rect x="430" y="256" width="340" height="34" rx="6" fill="#050a12" stroke="#1b2740"/>
    <circle class="node" cx="454" cy="273" r="4.5" fill="#22C55E"/>
    <text x="472" y="278" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#b9cde6">
      STATUS: <tspan fill="#22C55E">BUILDING THE FUTURE</tspan><tspan class="caret" fill="#00E5FF">_</tspan>
    </text>
  </g>

  <!-- razor bottom bar -->
  <g class="bar" style="transform-origin:600px 322px">
    <rect x="60" y="320" width="1080" height="2.5" rx="1.25" fill="url(#razor)" filter="url(#glow)"/>
  </g>

  <!-- scanline sweep -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00E5FF" opacity="0.5"/>
</svg>
