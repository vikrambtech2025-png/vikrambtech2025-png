<svg xmlns="http://www.w3.org/2000/svg" width="780" height="78" viewBox="0 0 780 78" fill="none">
  <defs>
    <linearGradient id="sg" x1="-0.6" y1="0" x2="1.6" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.44" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#1f2937"/>
      <animate attributeName="x1" values="-0.7;1.6;-0.7" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.3;2.0;-0.3" dur="7s" repeatCount="indefinite"/>
