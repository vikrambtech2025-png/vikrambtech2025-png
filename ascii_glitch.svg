<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="100%" height="100%" style="background:#0a0a0f;border-radius:12px">
<style>
@keyframes glitch {
  0%, 90%, 100% { transform: translate(0); opacity: 1; }
  92% { transform: translate(-3px, 0); opacity: 0.9; }
  94% { transform: translate(3px, 0); opacity: 0.95; }
  96% { transform: translate(-1px, 0); }
  98% { transform: translate(2px, 0); }
}
@keyframes wave {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-2px, 0); }
  75% { transform: translate(2px, 0); }
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  3% { opacity: 0.5; }
  6% { opacity: 1; }
  45% { opacity: 0.8; }
  48% { opacity: 1; }
}
@keyframes scanline {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}
.glitch-line { animation: glitch 4s ease-in-out infinite; }
.flicker { animation: flicker 2s steps(1) infinite; }
</style>
