name: Update profile stats

# Keeps the "N repos" and language-mix line in README.md accurate.
# Runs weekly; also manual-triggerable. If it reports "already up to date"
# it makes no commit, so the repo history stays quiet when nothing changed.

on:
  schedule:
    # Sundays 04:17 UTC - off the hour, because every workflow in the world
    # is scheduled at :00 and GitHub delays the queues hard at that time.
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite README stats from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh repo count and language mix"
          git push
