<svg xmlns="http://www.w3.org/2000/svg" width="520" height="205" viewBox="0 0 520 205" fill="none">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- orbit -->
  <g transform="translate(260 95)">
    <ellipse rx="160" ry="56" stroke="#27272a" stroke-width="1.4" stroke-dasharray="7 9"/>

    <!-- orbiting dots -->
    <circle r="4.5" fill="#22c55e">
      <animateMotion dur="16s" repeatCount="indefinite" path="M0 0 m-160 0 a160 56 0 1 0 320 0 a160 56 0 1 0 -320 0"/>
    </circle>
    <circle r="3.5" fill="#00b4d8">
      <animateMotion dur="10s" repeatCount="indefinite" path="M0 0 m160 0 a160 56 0 1 0 -320 0 a160 56 0 1 0 320 0"/>
    </circle>
    <circle r="3" fill="#f59e0b">
      <animateMotion dur="22s" repeatCount="indefinite" path="M0 0 m0 -56 a160 56 0 1 0 0 112 a160 56 0 1 0 0 -112"/>
    </circle>

    <!-- pulsing halo -->
    <circle r="34" stroke="#22c55e" stroke-width="1.2" fill="none">
      <animate attributeName="r" values="30;44;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- core -->
    <circle r="22" fill="url(#cg)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#0d1117"/>
  </g>

  <!-- waveform -->
  <g transform="translate(0 170)">
    <path d="M30 0 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#22c55e" stroke-opacity="0.7" stroke-width="2" fill="none">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M30 0 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0;
                M30 0 q30 14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0;
                M30 0 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    </path>
    <path d="M30 0 q30 12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#00b4d8" stroke-opacity="0.55" stroke-width="2" fill="none">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M30 0 q30 12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0;
                M30 0 q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0;
                M30 0 q30 12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    </path>
  </g>

  <!-- label -->
  <text x="260" y="200" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="4">
    AI · ML · LLM · RAG · CV
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4.5s" repeatCount="indefinite"/>
  </text>
</svg>