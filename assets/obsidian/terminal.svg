<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Animated terminal session">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF1F4B"/>
    </linearGradient>
    <pattern id="tscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .l{clip-path:inset(0 100% 0 0)}
    .d0{animation:typ0 16s linear infinite}
    .d1{animation:typ1 16s linear infinite}
    .d2{animation:typ2 16s linear infinite}
    .d3{animation:typ3 16s linear infinite}
    .d4{animation:typ4 16s linear infinite}
    .d5{animation:typ5 16s linear infinite}
    .d6{animation:typ6 16s linear infinite}
    .d7{animation:typ7 16s linear infinite}
    @keyframes typ0{0%,2%{clip-path:inset(0 100% 0 0)}5%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ1{0%,9%{clip-path:inset(0 100% 0 0)}12%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ2{0%,15%{clip-path:inset(0 100% 0 0)}18%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ3{0%,22%{clip-path:inset(0 100% 0 0)}26%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ4{0%,29%{clip-path:inset(0 100% 0 0)}34%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ5{0%,39%{clip-path:inset(0 100% 0 0)}43%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ6{0%,47%{clip-path:inset(0 100% 0 0)}52%,100%{clip-path:inset(0 0 0 0)}}
    @keyframes typ7{0%,56%{clip-path:inset(0 100% 0 0)}62%,100%{clip-path:inset(0 0 0 0)}}
    .cur{animation:cur 1s steps(1) infinite}
    @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
    .prog{animation:prog 16s linear infinite}
    @keyframes prog{0%{width:0}62%{width:250px}100%{width:250px}}
    .dot1{animation:dotal 2.4s ease-in-out infinite}
    .dot2{animation:dotal 2.4s ease-in-out infinite;animation-delay:.35s}
    .dot3{animation:dotal 2.4s ease-in-out infinite;animation-delay:.7s}
    @keyframes dotal{0%,100%{opacity:.35}50%{opacity:1}}
    .led{animation:led 1.6s ease-in-out infinite}
    @keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
  ]]></style>

  <rect x="1" y="1" width="898" height="348" rx="14" fill="url(#tbg)" stroke="#16203a" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="348" rx="14" fill="url(#tscan)"/>

  <!-- title bar -->
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v25H1z" fill="#080c16"/>
  <line x1="1" y1="40" x2="899" y2="40" stroke="#16203a" stroke-width="1.5"/>
  <circle class="dot1" cx="26" cy="20" r="6" fill="#FF1F4B"/>
  <circle class="dot2" cx="48" cy="20" r="6" fill="#FFB300"/>
  <circle class="dot3" cx="70" cy="20" r="6" fill="#22C55E"/>
  <text x="450" y="25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7f93af">vikram@obsidian: ~/ai</text>

  <!-- body -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15.5">
    <text class="l d0" x="34" y="84"><tspan fill="#00E5FF">vikram@obsidian</tspan><tspan fill="#5A6B85">:~$</tspan><tspan fill="#ffffff"> whoami</tspan></text>
    <text class="l d1" x="34" y="112"><tspan fill="#E6F1FF">vikram</tspan><tspan fill="#5A6B85">  ::  </tspan><tspan fill="#8B5CF6">ai/ml engineer</tspan></text>
    <text class="l d2" x="34" y="140"><tspan fill="#00E5FF">vikram@obsidian</tspan><tspan fill="#5A6B85">:~$</tspan><tspan fill="#ffffff"> cat focus.txt</tspan></text>
    <text class="l d3" x="34" y="168"><tspan fill="#FFB300">rag pipelines</tspan><tspan fill="#5A6B85"> | </tspan><tspan fill="#FF1F4B">llm apps</tspan><tspan fill="#5A6B85"> | </tspan><tspan fill="#00E5FF">autonomous agents</tspan></text>
    <text class="l d4" x="34" y="196"><tspan fill="#00E5FF">vikram@obsidian</tspan><tspan fill="#5A6B85">:~$</tspan><tspan fill="#ffffff"> python agent.py --research</tspan></text>
    <text class="l d5" x="34" y="228"><tspan fill="#22C55E">[ok]</tspan><tspan fill="#b9cde6"> 12 sources fetched</tspan></text>
    <text class="l d6" x="34" y="256"><tspan fill="#22C55E">[ok]</tspan><tspan fill="#b9cde6"> citations verified </tspan><tspan fill="#FFB300">12/12</tspan></text>
    <text class="l d7" x="34" y="284"><tspan fill="#22C55E">[ok]</tspan><tspan fill="#b9cde6"> report synthesised in </tspan><tspan fill="#00E5FF">4.2s</tspan></text>
    <g class="l d7">
      <text x="34" y="316"><tspan fill="#00E5FF">vikram@obsidian</tspan><tspan fill="#5A6B85">:~$</tspan></text>
      <rect class="cur" x="196" y="303" width="9" height="16" fill="#00E5FF"/>
    </g>
  </g>

  <!-- status footer -->
  <line x1="1" y1="330" x2="899" y2="330" stroke="#16203a" stroke-width="1.5"/>
  <rect x="34" y="338" width="250" height="3" rx="1.5" fill="#0e1626"/>
  <rect class="prog" x="34" y="338" width="0" height="3" rx="1.5" fill="url(#tbar)" filter="url(#tglow)"/>
  <circle class="led" cx="856" cy="339" r="5" fill="#22C55E" filter="url(#tglow)"/>
  <text x="845" y="343" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#5A6B85">SESSION LIVE</text>
</svg>
