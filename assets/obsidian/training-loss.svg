<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Training telemetry">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="lossg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1F4B"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="accg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="lglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0c1424" stroke-width="1"/>
    </pattern>
  </defs>

  <style><![CDATA[
    .loss{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 7s ease-out infinite}
    .acc{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 7s ease-out infinite;animation-delay:.5s}
    @keyframes draw{0%{stroke-dashoffset:1000}72%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    .blink{animation:bl 1.4s ease-in-out infinite}
    @keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
  ]]></style>

  <rect width="1000" height="300" fill="url(#lbg)"/>
  <rect x="60" y="44" width="880" height="210" fill="#03060c" stroke="#16203a" stroke-width="1.4" rx="8"/>
  <rect x="60" y="44" width="880" height="210" fill="url(#lgrid)" opacity="0.6" clip-path="inset(0 round 8px)"/>

  <text x="72" y="34" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00E5FF">TRAINING TELEMETRY</text>
  <text x="928" y="34" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5A6B85">epochs &#8594;</text>

  <!-- axes labels -->
  <text x="72" y="72" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#5A6B85">1.0</text>
  <text x="72" y="250" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#5A6B85">0.0</text>

  <!-- curves -->
  <path class="loss" d="M80,70 C250,82 350,150 500,190 S780,232 930,238"
        fill="none" stroke="url(#lossg)" stroke-width="3" stroke-linecap="round" pathLength="1000" filter="url(#lglow)"/>
  <path class="acc" d="M80,240 C250,228 400,168 560,118 S820,70 930,62"
        fill="none" stroke="url(#accg)" stroke-width="3" stroke-linecap="round" pathLength="1000" filter="url(#lglow)"/>

  <!-- moving markers -->
  <circle r="5" fill="#FF1F4B" filter="url(#lglow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M80,70 C250,82 350,150 500,190 S780,232 930,238"/>
  </circle>
  <circle r="5" fill="#22C55E" filter="url(#lglow)">
    <animateMotion dur="7s" repeatCount="indefinite" begin="0.5s" path="M80,240 C250,228 400,168 560,118 S820,70 930,62"/>
  </circle>

  <!-- legend -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <rect x="620" y="212" width="14" height="4" rx="2" fill="#FF1F4B"/>
    <text x="642" y="219" fill="#b9cde6">loss &#8595;</text>
    <rect x="760" y="212" width="14" height="4" rx="2" fill="#22C55E"/>
    <text x="782" y="219" fill="#b9cde6">accuracy &#8593;</text>
  </g>

  <!-- footer -->
  <circle class="blink" cx="80" cy="278" r="4.5" fill="#22C55E" filter="url(#lglow)"/>
  <text x="94" y="282" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#5A6B85">converging &#183; gpu: 6GB &#183; no api key</text>
</svg>
