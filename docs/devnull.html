<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>/dev/null — where deleted files go</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<style>
  :root{--cyan:#00E5FF;--violet:#8B5CF6;--gold:#FFB300;--green:#22C55E;--crimson:#FF1F4B;--edge:#16203a;--dim:#5A6B85;--mid:#8ea3bd}
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#dce9f7;font:15px/1.65 ui-monospace,Consolas,monospace;display:grid;place-items:center;min-height:100vh}
  .wrap{text-align:center;padding:24px;max-width:640px}
  h1{font-size:clamp(40px,10vw,96px);margin:0;letter-spacing:6px;color:var(--green);text-shadow:0 0 30px rgba(34,197,94,.3)}
  p{color:var(--mid);letter-spacing:1px}
  .bits{height:180px;overflow:hidden;position:relative;border:1px solid var(--edge);border-radius:12px;background:#05070d;margin:24px 0;text-align:left}
  .bits code{display:block;color:var(--dim);font-size:12px;white-space:pre;animation:fall 12s linear infinite;padding:6px 14px}
  @keyframes fall{from{transform:translateY(-50%)}to{transform:translateY(0)}}
  a{color:#dce9f7;text-decoration:none;border:1px solid var(--edge);padding:10px 18px;border-radius:9px;font-size:13px;display:inline-block;margin:4px}
  a:hover{border-color:var(--green);color:var(--green)}
  @media (prefers-reduced-motion: reduce){.bits code{animation:none}}
</style>
</head>
<body>
  <main class="wrap">
    <h1>/dev/null</h1>
    <p>you found the page that swallows everything. nothing here is lost — it's just honest.</p>
    <div class="bits" aria-hidden="true"><code id="t"></code></div>
    <p style="color:var(--dim);font-size:12.5px">false → true · null → void · bug → feature · doubt → shipped</p>
    <a href="./">⟲ back to base</a>
    <a href="https://github.com/vikrambtech2025-png/vikrambtech2025-png/issues/3">✍️ sign the guestbook</a>
  </main>
<script>
  const lines = [];
  for (let i = 0; i < 60; i++){
    const kinds = ['rm -rf doubt.log','cat /dev/null > fear','true','false → true','git commit -m "fix: belief"','npm run ship --production','echo "keep going" >> /dev/null','trace: agent resolved real problem','sudo make me a sandwich','kill -9 imposter_syndrome','chmod +x ambition','./deploy.sh --no-fear'];
    lines.push(kinds[(Math.random()*kinds.length)|0]);
  }
  document.getElementById('t').textContent = lines.join('\n') + '\n' + lines.join('\n');
</script>
</body>
</html>
