<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Access granted">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="stxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    .ring{animation:ring 3.2s ease-out infinite}
    @keyframes ring{0%{r:24;opacity:.8}100%{r:104;opacity:0}}
    .b1{animation:bb 1.1s steps(1) infinite}
    .b2{animation:bb 1.1s steps(1) infinite;animation-delay:.55s}
    @keyframes bb{0%,49%{opacity:1}50%,100%{opacity:.15}}
    .flicker{animation:flk 4s ease-in-out infinite}
    @keyframes flk{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.35}49%{opacity:1}86%{opacity:.5}87%{opacity:1}}
  ]]></style>

  <rect width="800" height="220" fill="url(#sbg)"/>
  <rect x="1" y="1" width="798" height="218" rx="14" fill="none" stroke="#16203a" stroke-width="2"/>

  <g fill="none" stroke="#00E5FF" stroke-width="1.6">
    <circle class="ring" cx="400" cy="96" r="24"/>
    <circle class="ring" cx="400" cy="96" r="24" style="animation-delay:1.06s"/>
    <circle class="ring" cx="400" cy="96" r="24" style="animation-delay:2.12s"/>
  </g>
  <circle cx="400" cy="96" r="24" fill="#050a12" stroke="#00E5FF" stroke-width="2" filter="url(#sglow)"/>
  <path d="M392 96 l6 7 l12 -15" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#sglow)"/>

  <text class="flicker" x="400" y="150" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" letter-spacing="6" font-weight="700" fill="url(#stxt)" filter="url(#sglow)">ACCESS GRANTED</text>
  <text class="b1" x="400" y="176" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5A6B85">you actually scrolled here. respect.</text>
  <text class="b2" x="400" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#FFB300">easter egg #2 &#8594; the terminal never lies</text>
</svg>
